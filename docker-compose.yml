version: '3.8'

services:
  memoria:
    build: .
    container_name: memoria
    ports:
      - "8080:8080"
    volumes:
      # Persistent SQLite DB and archived activity logs
      - ./data:/data
      # Read-only bind mounts to your local photo/video storage folders
      - ./media_sources:/media_sources:ro
    environment:
      - DATABASE_URL=sqlite:///data/memoria.db?mode=rwc
      - RUST_LOG=info
    restart: unless-stopped
